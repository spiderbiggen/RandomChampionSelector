name: Release CI

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Release Bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build

      - name: Decode keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          keystore_path="${RUNNER_TEMP}/keystore.jks"
          printf '%s' "$ENCODED_KEYSTORE" | base64 -di > "$keystore_path"
          echo "SIGNING_STORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Assemble release bundle and APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew app:bundleRelease app:assembleRelease

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

  changelog:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          make_latest: true
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}
          files: |
            **/*.apk
            **/*.aab