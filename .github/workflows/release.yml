name: Release CI

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch: [ ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Release Bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build

      - name: Decode keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          keystore_path="${RUNNER_TEMP}/keystore.jks"
          printf '%s' "$ENCODED_KEYSTORE" | base64 -di > "$keystore_path"
          echo "SIGNING_STORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Assemble release bundle and APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew app:bundleRelease app:assembleRelease

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
